<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presenter — In-Class Questions · CSCI 4845/5845</title>
<link rel="stylesheet" href="poll.css">
<script src="qrcode.min.js"></script>
</head>
<body>

<div class="topbar">
  <span class="brand">CSCI 4845/5845</span>
  <span class="sub">In-class questions · presenter</span>
  <a href="index.html" target="_blank" rel="noopener">student view</a>
</div>

<div id="app" class="present-grid">
  <div class="card"><p class="muted">Loading…</p></div>
</div>

<script type="module">
import { firebaseConfig, COURSE, INSTRUCTOR_EMAILS, STUDENT_URL, configured } from "./firebase-config.js";
import { renderMC, renderTextWall } from "./poll-ui.js";
import { LEC01 } from "./questions-lec01.js";

const app = document.getElementById("app");

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

if (!configured) {
  app.innerHTML = `<div class="setup-warn" style="grid-column:1/-1"><strong>Not configured
    yet.</strong> Paste your Firebase project config into <code>firebase-config.js</code> —
    setup steps are in that file.</div>`;
} else {
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } =
    await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
  const { getFirestore, doc, setDoc, onSnapshot, collection, query, where, getDocs, serverTimestamp } =
    await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");

  const fb = initializeApp(firebaseConfig);
  const auth = getAuth(fb);
  const db = getFirestore(fb);

  let me = null;
  let questions = [];
  let activeQid = null;
  let responses = [];
  let unsubR = null;
  let qrDrawn = false;
  let browseOn = false;
  let stateSet = null;   // set currently open for students (on state/control)
  let viewSet = null;    // set selected in the sidebar dropdown

  const isInstructor = (u) => !!u && !u.isAnonymous && INSTRUCTOR_EMAILS.includes(u.email);

  function renderSignIn(msg) {
    app.innerHTML = `
      <div class="card" style="grid-column:1/-1;max-width:520px">
        <p class="prompt">Presenter sign-in</p>
        ${msg ? `<p class="muted">${esc(msg)}</p>` : ""}
        <button class="btn" id="gsi">Sign in with Google</button>
        <p class="tiny">Only ${esc(INSTRUCTOR_EMAILS.join(", "))} can control questions.</p>
      </div>`;
    document.getElementById("gsi").onclick = () =>
      signInWithPopup(auth, new GoogleAuthProvider()).catch(e => renderSignIn(e.code));
  }

  function shell() {
    app.innerHTML = `
      <div class="sidebar">
        <div class="card">
          <p class="muted"><strong>Questions</strong></p>
          <label class="tiny" for="set-pick">Question set</label>
          <select class="field" id="set-pick" style="margin:0.2rem 0 0.4rem"></select>
          <ul class="qlist" id="qlist"></ul>
          <button class="btn" id="btn-open-set" style="width:100%">Open set — students self-pace</button>
          <button class="btn secondary" id="btn-close-set" style="width:100%">Close set</button>
          <p class="tiny" id="browse-hint" style="margin:0.25rem 0 0.55rem"></p>
          <button class="btn secondary" id="btn-hide" style="width:100%">Hide question (blank screen)</button>
          <button class="btn secondary" id="btn-seed" style="width:100%">Seed Lecture 1 set</button>
          <button class="btn secondary" id="btn-csv" style="width:100%">Export responses CSV</button>
          <button class="btn secondary" id="btn-att" style="width:100%">Export attendance CSV</button>
          <p class="tiny">Signed in as ${esc(me.email)} · <a href="#" id="signout">sign out</a></p>
        </div>
        <div class="card qr-box">
          <p class="muted"><strong>Students join at</strong></p>
          <p class="join-url">jinzhao3611.github.io/csci4845/q</p>
          <div class="qr" id="qr"></div>
        </div>
      </div>
      <div class="stage">
        <div class="card" id="stage-card">
          <p class="muted">No question is live. Click one on the left to put it on screen.</p>
        </div>
      </div>`;
    document.getElementById("btn-hide").onclick = () => setControl(null);
    document.getElementById("btn-open-set").onclick = openSet;
    document.getElementById("btn-close-set").onclick = closeSet;
    document.getElementById("set-pick").onchange = (e) => {
      viewSet = e.target.value; renderList(); renderSetControls();
    };
    document.getElementById("btn-seed").onclick = seedLec01;
    document.getElementById("btn-csv").onclick = exportCSV;
    document.getElementById("btn-att").onclick = exportAttendance;
    document.getElementById("signout").onclick = (e) => { e.preventDefault(); signOut(auth); };
    new QRCode(document.getElementById("qr"),
      { text: STUDENT_URL, width: 210, height: 210, correctLevel: QRCode.CorrectLevel.M });
    qrDrawn = true;
    renderSetPick(); renderList(); renderStage(); renderSetControls();
  }

  // A question's set: explicit field, else the id prefix ("lec01-q3" → "lec01").
  const qSet = (q) => q.set ?? String(q.id).split("-")[0];
  const setNames = () => [...new Set(questions.map(qSet))].sort();
  const inView = () => questions.filter(q => !viewSet || qSet(q) === viewSet);

  function renderSetPick() {
    const sel = document.getElementById("set-pick");
    if (!sel) return;
    const names = setNames();
    if (!viewSet || !names.includes(viewSet)) {
      viewSet = (stateSet && names.includes(stateSet)) ? stateSet : (names.at(-1) ?? null);
    }
    sel.innerHTML = names.length
      ? names.map(s => `<option value="${esc(s)}"${s === viewSet ? " selected" : ""}>${esc(s)}</option>`).join("")
      : `<option value="">(no questions yet)</option>`;
  }

  function renderSetControls() {
    const open = document.getElementById("btn-open-set");
    const close = document.getElementById("btn-close-set");
    const hint = document.getElementById("browse-hint");
    if (open) open.disabled = !inView().length;
    if (close) close.disabled = !browseOn;
    if (hint) hint.textContent = browseOn
      ? `Set “${stateSet ?? "all"}” is open — students answer at their own pace.`
      : "Set closed — students see only the question you make live.";
  }

  function openSet() {
    const qs = inView();
    if (!qs.length) return;
    setDoc(doc(db, "courses", COURSE, "state", "control"),
      { qid: qs[0].id, set: viewSet, browse: true, updatedAt: serverTimestamp() }).catch(alertErr);
  }

  function closeSet() {
    setDoc(doc(db, "courses", COURSE, "state", "control"),
      { qid: null, set: stateSet, browse: false, updatedAt: serverTimestamp() }).catch(alertErr);
  }

  function renderList() {
    const ul = document.getElementById("qlist");
    if (!ul) return;
    const qs = inView();
    ul.innerHTML = qs.length
      ? qs.map(q => `
          <li data-qid="${esc(q.id)}" class="${q.id === activeQid ? "live" : ""}">
            <span class="qtype">${q.type === "mc" ? "MC" : "TEXT"}</span>${esc(q.prompt)}
          </li>`).join("")
      : `<li style="cursor:default"><span class="muted">No questions in this set yet — use
         “Seed Lecture 1 set”.</span></li>`;
    for (const li of ul.querySelectorAll("li[data-qid]")) {
      li.onclick = () => setControl(li.dataset.qid);
    }
  }

  function renderStage() {
    const card = document.getElementById("stage-card");
    if (!card) return;
    const q = questions.find(x => x.id === activeQid);
    if (!q) {
      card.innerHTML = `<p class="muted">No question is live. Click one on the left to put
        it on screen.</p>`;
      return;
    }
    const n = q.type === "mc"
      ? responses.filter(r => Number.isInteger(r.choice)).length
      : responses.filter(r => (r.text ?? "").trim()).length;
    card.innerHTML = `
      <p class="muted"><span class="count-pill">${n} answered</span></p>
      <p class="prompt">${esc(q.prompt)}</p>
      <div class="results" id="stage-results" aria-live="polite"></div>`;
    const el = document.getElementById("stage-results");
    if (q.type === "mc") renderMC(el, q, responses);
    else renderTextWall(el, responses);
  }

  function setControl(qid) {
    setDoc(doc(db, "courses", COURSE, "state", "control"),
      { qid: qid ?? null, set: stateSet, browse: browseOn, updatedAt: serverTimestamp() }).catch(alertErr);
  }

  async function seedLec01() {
    try {
      for (const q of LEC01) {
        await setDoc(doc(db, "courses", COURSE, "questions", q.id),
          { ...q, set: q.set ?? String(q.id).split("-")[0] });
      }
    } catch (e) { alertErr(e); }
  }

  function downloadCSV(rows, filename) {
    const csv = "﻿" + rows.map(row =>
      row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  async function exportCSV() {
    try {
      const qs = new Map(questions.map(q => [q.id, q]));
      const snap = await getDocs(collection(db, "courses", COURSE, "responses"));
      const rows = [["timestamp", "set", "qid", "question", "type", "name", "email", "answer"]];
      for (const d of snap.docs) {
        const r = d.data();
        const q = qs.get(r.qid);
        const answer = q?.type === "mc"
          ? (q.choices?.[r.choice] ?? String(r.choice ?? ""))
          : (r.text ?? "");
        rows.push([
          r.ts?.toDate?.()?.toISOString?.() ?? "",
          q ? qSet(q) : String(r.qid ?? "").split("-")[0],
          r.qid ?? "", q?.prompt ?? "", q?.type ?? "",
          r.name ?? "", r.email ?? "", answer,
        ]);
      }
      downloadCSV(rows, `csci4845-responses-${new Date().toISOString().slice(0, 10)}.csv`);
    } catch (e) { alertErr(e); }
  }

  // One row per student per set — for attendance/participation grading.
  async function exportAttendance() {
    try {
      const totals = new Map();
      for (const q of questions) totals.set(qSet(q), (totals.get(qSet(q)) ?? 0) + 1);
      const setOf = new Map(questions.map(q => [q.id, qSet(q)]));
      const snap = await getDocs(collection(db, "courses", COURSE, "responses"));
      const agg = new Map();
      for (const d of snap.docs) {
        const r = d.data();
        const set = setOf.get(r.qid) ?? String(r.qid ?? "").split("-")[0];
        const email = (r.email ?? "").toLowerCase();
        const key = `${set}|${email}`;
        const ts = r.ts?.toDate?.() ?? null;
        let a = agg.get(key);
        if (!a) { a = { set, email, name: r.name ?? "", qids: new Set(), first: ts, last: ts }; agg.set(key, a); }
        a.qids.add(r.qid);
        if (r.name) a.name = r.name;
        if (ts && (!a.first || ts < a.first)) a.first = ts;
        if (ts && (!a.last || ts > a.last)) a.last = ts;
      }
      const rows = [["set", "date", "name", "email", "questions_answered", "questions_in_set",
                     "first_answer", "last_answer"]];
      const sorted = [...agg.values()].sort((x, y) =>
        x.set === y.set ? x.name.localeCompare(y.name) : x.set.localeCompare(y.set));
      for (const a of sorted) {
        rows.push([
          a.set, a.first ? a.first.toISOString().slice(0, 10) : "",
          a.name, a.email, a.qids.size, totals.get(a.set) ?? "",
          a.first ? a.first.toISOString() : "", a.last ? a.last.toISOString() : "",
        ]);
      }
      downloadCSV(rows, `csci4845-attendance-${new Date().toISOString().slice(0, 10)}.csv`);
    } catch (e) { alertErr(e); }
  }

  function alertErr(e) { console.error(e); alert(`Error: ${e.code || e.message}`); }

  function watchResponses(qid) {
    if (unsubR) { unsubR(); unsubR = null; }
    responses = [];
    if (!qid) { renderStage(); return; }
    unsubR = onSnapshot(
      query(collection(db, "courses", COURSE, "responses"), where("qid", "==", qid)),
      (snap) => { responses = snap.docs.map(d => d.data()); renderStage(); });
  }

  onAuthStateChanged(auth, (user) => {
    if (!isInstructor(user)) {
      me = null; qrDrawn = false;
      renderSignIn(user ? `${user.email ?? "This account"} is not an instructor account.` : "");
      return;
    }
    me = user;
    shell();
    onSnapshot(collection(db, "courses", COURSE, "questions"), (snap) => {
      questions = snap.docs.map(d => d.data()).sort((a, b) =>
        qSet(a) === qSet(b) ? (a.order ?? 0) - (b.order ?? 0) : (qSet(a) < qSet(b) ? -1 : 1));
      renderSetPick(); renderList(); renderStage(); renderSetControls();
    });
    onSnapshot(doc(db, "courses", COURSE, "state", "control"), (snap) => {
      const qid = snap.exists() ? (snap.data().qid ?? null) : null;
      browseOn = snap.exists() && snap.data().browse === true;
      stateSet = snap.exists() ? (snap.data().set ?? null) : null;
      if (qid !== activeQid) { activeQid = qid; watchResponses(qid); }
      renderSetPick(); renderList(); renderStage(); renderSetControls();
    });
  });
}
</script>

</body>
</html>
